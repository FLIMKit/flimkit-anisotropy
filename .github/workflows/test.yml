name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install tkinter and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install FLIMKit and this package
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/FLIMKit/FLIMKit
          pip install -e '.[test]'

      - name: Run tests
        env:
          FLIMKIT_NO_PLUGINS: '1'
        run: xvfb-run -a pytest -q --tb=short
