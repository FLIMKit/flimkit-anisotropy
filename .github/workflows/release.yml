name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Verify tag and version identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag) is None:
              raise SystemExit(f'Invalid release tag: {tag!r}')
          expected = tag[1:]
          pyproject = tomllib.loads(Path('pyproject.toml').read_text())
          package_text = Path('flimkit_anisotropy/__init__.py').read_text()
          citation_text = Path('CITATION.cff').read_text()
          package_match = re.search(
              r"^__version__\s*=\s*['\"]([^'\"]+)['\"]$",
              package_text, re.MULTILINE)
          citation_match = re.search(
              r'^version:\s*([^\s]+)\s*$', citation_text, re.MULTILINE)
          versions = {
              'tag': expected,
              'pyproject.toml': pyproject['project']['version'],
              'flimkit_anisotropy/__init__.py': (
                  package_match.group(1) if package_match else None),
              'CITATION.cff': (
                  citation_match.group(1) if citation_match else None),
          }
          if any(value != expected for value in versions.values()):
              raise SystemExit(f'Release version mismatch: {versions}')
          print(f'Verified release identity: {tag}')
          PY

      - name: Install tkinter and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install pinned test and build tools
        run: |
          python -m pip install pip==26.2.1
          pip install git+https://github.com/FLIMKit/FLIMKit@f7185e664606bd8a8f65a34f971554a395810e14
          pip install -e '.[test]'
          pip install build==1.6.0 twine==7.0.0

      - name: Run tests
        env:
          FLIMKIT_NO_PLUGINS: '1'
        run: xvfb-run -a pytest -q --tb=short

      - name: Build and check release artifacts
        run: |
          python -m build
          twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload checked release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: validate-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download checked release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
