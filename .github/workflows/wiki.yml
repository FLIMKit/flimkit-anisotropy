name: wiki

on:
  push:
    branches: [main]
    paths:
      - 'Docs/documentation.md'
      - 'Docs/build_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Clone wiki
        run: |
          remote=https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
          if ! git clone "$remote" wiki; then
            echo 'The wiki has no git repository yet, and GitHub will not create one by push.'
            echo 'Open the Wiki tab, create any page, save it, then re-run this workflow.'
            echo 'The page is overwritten on the first sync, so its content does not matter.'
            exit 1
          fi

      - name: Build pages
        run: |
          rm -f wiki/*.md
          python Docs/build_wiki.py wiki

      - name: Push to wiki
        run: |
          cd wiki
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'wiki already up to date'
          else
            git commit -m "Sync wiki from ${{ github.sha }}"
            git push origin HEAD
          fi
